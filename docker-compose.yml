services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: v1.0.0
        NEXT_PUBLIC_ENV_NAME: DEV
    container_name: kubepulse-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_ENV_NAME=DEV
      - NEXT_PUBLIC_APP_VERSION=v1.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kubepulse-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: kubepulse-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ENV_NAME=DEV
      - APP_VERSION=v1.0.0
      - ENABLE_REDIS=false
      - REDIS_TTL_SECONDS=30
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/kubepulse?schema=public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kubepulse-net

  postgres:
    image: postgres:16-alpine
    container_name: kubepulse-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kubepulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kubepulse"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kubepulse-net

volumes:
  postgres_data:

networks:
  kubepulse-net:
    driver: bridge
