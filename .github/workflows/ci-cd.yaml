name: KubePulse CI/CD & GitOps Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/hengvisoth/kubepulse

jobs:
  validate:
    name: Validate Apps, Compose, and Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Test and Build Backend
        working-directory: apps/backend
        run: |
          npm run prisma:generate
          npm test
          npm run build

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Validate Compose Files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.standalone.yml config --quiet

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate Both Overlays
        run: |
          kustomize build k8s/overlays/dev > /dev/null
          kustomize build k8s/overlays/prod > /dev/null

  build-and-publish:
    name: Build and Publish All Service Images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and Push Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=gateway
          tags: |
            ${{ env.IMAGE_PREFIX }}-gateway:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-gateway:latest

      - name: Build and Push Components Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=components
          tags: |
            ${{ env.IMAGE_PREFIX }}-components:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-components:latest

      - name: Build and Push Incidents Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=incidents
          tags: |
            ${{ env.IMAGE_PREFIX }}-incidents:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-incidents:latest

      - name: Build and Push Status Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=status
          tags: |
            ${{ env.IMAGE_PREFIX }}-status:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-status:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.tag }}
            NEXT_PUBLIC_ENV_NAME=PROD
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      # This step runs only after all five image publishes succeed.
      - name: Update Both Overlay Image Tags
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for overlay in dev prod; do
            (
              cd "k8s/overlays/${overlay}"
              for role in gateway components incidents status frontend; do
                kustomize edit set image \
                  "${IMAGE_PREFIX}-${role}=${IMAGE_PREFIX}-${role}:${TAG}"
              done
            )
            kustomize build "k8s/overlays/${overlay}" > /dev/null
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml k8s/overlays/prod/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(gitops): bump all images to ${TAG} [skip ci]"
          git push
