events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format lb_log '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    'upstream: $upstream_addr response_time: $upstream_response_time '
                    'load_balancer: kubepulse-nginx-lb';

  access_log /var/log/nginx/access.log lb_log;
  error_log /var/log/nginx/error.log warn;

  # Upstream pool for API Gateways (Round-Robin with failover)
  upstream gateway_pool {
    server gateway-1:5000 max_fails=2 fail_timeout=5s;
    server gateway-2:5000 max_fails=2 fail_timeout=5s;
    server gateway-3:5000 max_fails=2 fail_timeout=5s;
  }

  # Upstream pool for Frontend UI Replicas
  upstream frontend_pool {
    server frontend-1:3000 max_fails=2 fail_timeout=5s;
    server frontend-2:3000 max_fails=2 fail_timeout=5s;
  }

  # Port 80: Main Web Load Balancer (Frontend + API Proxy)
  server {
    listen 80;
    server_name localhost dev.kubepulse.local status.kubepulse.local;

    # Expose load balancer identification header
    add_header X-Load-Balancer "kubepulse-nginx-lb" always;
    add_header X-Upstream-Backend $upstream_addr always;

    # Route /backend-api to frontend proxy (which load balances to gateway)
    location /backend-api/ {
      proxy_pass http://frontend_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
    }

    # Route API direct endpoints to gateway pool
    location ~ ^/(api|services|chaos|healthz|readyz|metrics)/? {
      proxy_pass http://gateway_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
    }

    # Default: Route to frontend pool
    location / {
      proxy_pass http://frontend_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }

  # Port 5000: Direct API Gateway Load Balancer
  server {
    listen 5000;
    server_name localhost;

    add_header X-Load-Balancer "kubepulse-nginx-lb" always;
    add_header X-Upstream-Backend $upstream_addr always;

    location / {
      proxy_pass http://gateway_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
