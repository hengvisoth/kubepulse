---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
  labels:
    app.kubernetes.io/managed-by: rancher
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: kubepulse
  name: kubepulse-ingress
  namespace: kubepulse-prod
spec:
  rules:
  - host: status.kubepulse.local
    http:
      paths:
      - backend:
          service:
            name: frontend-service
            port:
              number: 3000
        path: "/backend-api"
        pathType: Prefix
      - backend:
          service:
            name: gateway-service
            port:
              number: 5000
        path: "/services"
        pathType: Prefix
      - backend:
          service:
            name: gateway-service
            port:
              number: 5000
        path: "/chaos"
        pathType: Prefix
      - backend:
          service:
            name: gateway-service
            port:
              number: 5000
        path: "/metrics"
        pathType: Exact
      - backend:
          service:
            name: gateway-service
            port:
              number: 5000
        path: "/healthz"
        pathType: Exact
      - backend:
          service:
            name: gateway-service
            port:
              number: 5000
        path: "/readyz"
        pathType: Exact
      - backend:
          service:
            name: frontend-service
            port:
              number: 3000
        path: "/"
        pathType: Prefix
  tls:
  - hosts:
    - status.kubepulse.local
    secretName: kubepulse-prod-tls
