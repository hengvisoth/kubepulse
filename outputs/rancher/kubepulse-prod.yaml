apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: rancher
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: kubepulse
  name: redis
  namespace: kubepulse-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubepulse-redis
  template:
    metadata:
      labels:
        app: kubepulse-redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: kubepulse
    spec:
      containers:
      - image: redis:7-alpine
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
