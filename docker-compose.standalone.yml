services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: v1.0.0
        NEXT_PUBLIC_ENV_NAME: DEV
    container_name: kubepulse-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_ENV_NAME=DEV
      - NEXT_PUBLIC_APP_VERSION=v1.0.0
    depends_on:
      - backend
    networks:
      - kubepulse-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: kubepulse-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ENV_NAME=DEV
      - APP_VERSION=v1.0.0
      - ENABLE_REDIS=false
      - REDIS_TTL_SECONDS=30
    networks:
      - kubepulse-net

networks:
  kubepulse-net:
    driver: bridge
