services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: v1.0.0
        NEXT_PUBLIC_ENV_NAME: DEV
    container_name: kubepulse-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      INTERNAL_BACKEND_URL: http://gateway:5000
      NEXT_PUBLIC_ENV_NAME: DEV
      NEXT_PUBLIC_APP_VERSION: v1.0.0
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - kubepulse-net

  gateway:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    image: kubepulse-gateway:local
    container_name: kubepulse-gateway
    ports:
      - "5000:5000"
    environment:
      SERVICE_NAME: gateway
      PORT: "5000"
      NODE_ENV: production
      ENV_NAME: DEV
      APP_VERSION: v1.0.0
      UPSTREAM_TIMEOUT_MS: "5000"
      COMPONENTS_SERVICE_URL: http://components:5000
      INCIDENTS_SERVICE_URL: http://incidents:5000
      STATUS_SERVICE_URL: http://status:5000
      ENABLE_REDIS: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kubepulse-net

  components:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: components
    image: kubepulse-components:local
    container_name: kubepulse-components
    ports:
      - "5001:5000"
    environment:
      SERVICE_NAME: components
      PORT: "5000"
      NODE_ENV: production
      ENV_NAME: DEV
      APP_VERSION: v1.0.0
      UPSTREAM_TIMEOUT_MS: "5000"
      STATUS_SERVICE_URL: http://status:5000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kubepulse?schema=public
      ENABLE_REDIS: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kubepulse-net

  incidents:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: incidents
    image: kubepulse-incidents:local
    container_name: kubepulse-incidents
    ports:
      - "5002:5000"
    environment:
      SERVICE_NAME: incidents
      PORT: "5000"
      NODE_ENV: production
      ENV_NAME: DEV
      APP_VERSION: v1.0.0
      UPSTREAM_TIMEOUT_MS: "5000"
      STATUS_SERVICE_URL: http://status:5000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kubepulse?schema=public
      ENABLE_REDIS: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kubepulse-net

  status:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: status
    image: kubepulse-status:local
    container_name: kubepulse-status
    ports:
      - "5003:5000"
    environment:
      SERVICE_NAME: status
      PORT: "5000"
      NODE_ENV: production
      ENV_NAME: DEV
      APP_VERSION: v1.0.0
      UPSTREAM_TIMEOUT_MS: "5000"
      COMPONENTS_SERVICE_URL: http://components:5000
      INCIDENTS_SERVICE_URL: http://incidents:5000
      ENABLE_REDIS: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kubepulse-net

networks:
  kubepulse-net:
    driver: bridge
