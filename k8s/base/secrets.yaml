apiVersion: v1
kind: Secret
metadata:
  name: kubepulse-secret
  labels:
    app.kubernetes.io/part-of: kubepulse
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: kubepulse-secure-password
  DATABASE_URL: postgresql://postgres:kubepulse-secure-password@postgres-service:5432/kubepulse?schema=public
