apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubepulse
spec:
  type: NodePort
  selector:
    app: kubepulse-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
