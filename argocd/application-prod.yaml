apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubepulse-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hengvisoth/kubepulse.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kubepulse-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  # Each HPA owns its service replica count.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: gateway
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: components
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: incidents
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: status
      jsonPointers:
        - /spec/replicas
